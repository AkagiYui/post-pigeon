version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

vars:
  APP_NAME: "PostPigeon"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # 应用版本号，从 config.yml 自动读取（读取 info.version 字段）
  APP_VERSION:
    sh: awk '/^[[:space:]]+version:/ { match($0, /"[^"]+"/); print substr($0, RSTART+1, RLENGTH-2); exit }' build/config.yml
  # 构建信息，通过 ldflags 注入到应用中
  BUILD_HASH:
    sh: git rev-parse HEAD 2>/dev/null || echo "dev"
  # 构建时间戳，UTC时间
  BUILD_TIME:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"

tasks:
  check:
    summary: 本地跑一遍 CI 的全部校验（gofmt / vet / go test / typecheck / lint / 前端单测）
    cmds:
      - task: check:go
      - task: check:frontend

  check:go:
    summary: Go 侧校验：gofmt + vet + build + race 测试
    cmds:
      - |
        unformatted=$(gofmt -l . | grep -v '^frontend/' || true)
        if [ -n "$unformatted" ]; then
          echo "以下文件未通过 gofmt："; echo "$unformatted"; exit 1
        fi
      - go vet ./...
      - go build ./...
      - go test -race ./internal/... ./testserver/...

  check:frontend:
    summary: 前端校验：类型检查 + ESLint + 单元测试
    dir: frontend
    cmds:
      - pnpm typecheck
      - pnpm lint
      - pnpm test

  test:
    summary: 跑全部单元测试（Go + 前端）
    cmds:
      - go test ./internal/... ./testserver/...
      - task: test:frontend

  test:frontend:
    summary: 跑前端单元测试
    dir: frontend
    cmds:
      - pnpm test

  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
