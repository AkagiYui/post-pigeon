name: 校验

on:
  pull_request:
  # 供 build.yaml / release.yaml 在打包前复用同一套校验。
  # 这里刻意没有 push:master —— build.yaml 本来就监听 master 推送并无条件跑
  # checks，再加一个 push 触发只会让每次推送把整套校验跑两遍。
  workflow_call:

# 同一分支的重复推送只保留最新一次校验
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v3.0.0-beta.13

jobs:
  go:
    name: Go 校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 不用 setup-go 自带缓存：它的 key 只含 hash(go.sum)，仓库里几个
      # 构建负载（普通 build、-race 测试、-trimpath 生产打包）会抢同一个条目，
      # 而且只在 miss 时写入、之后永不更新。独立 key + restore-keys 才能滚动前进。
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: 'go.mod'

      - name: 解析 Go 缓存路径
        id: gocache
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "bin=$(go env GOPATH)/bin"
          } >> "$GITHUB_OUTPUT"

      - name: 缓存 Go 构建产物
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-check-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-check-${{ runner.os }}-

      - name: 安装 Linux 依赖
        run: |
          # runner 镜像预装的 packages.microsoft.com 源时不时返回 403，会让整条
          # apt-get update 以 exit 100 失败、把这一步带崩（见 run 32970102097）。
          # 本项目只要 Ubuntu 官方源里的 GTK / WebKit 开发包，直接把它摘掉。
          grep -rl 'packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      # main.go 用 //go:embed all:frontend/dist 嵌入前端产物，而 dist 不入库；
      # 校验流程不构建前端，补个占位文件让 embed 能解析（all: 前缀会收 . 开头的文件）
      - name: 准备 embed 占位目录
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l . | grep -v '^frontend/' || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: 单元测试（含竞态检测与覆盖率）
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./internal/... ./testserver/...

      - name: 覆盖率摘要
        run: |
          go tool cover -func=coverage.out | tail -1
          {
            echo '### Go 覆盖率'
            echo '```'
            go tool cover -func=coverage.out | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传覆盖率
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

  frontend:
    name: 前端校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 不用 setup-go 自带缓存：它的 key 只含 hash(go.sum)，仓库里几个
      # 构建负载（普通 build、-race 测试、-trimpath 生产打包）会抢同一个条目，
      # 而且只在 miss 时写入、之后永不更新。独立 key + restore-keys 才能滚动前进。
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: 'go.mod'

      - name: 解析 Go 缓存路径
        id: gocache
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "bin=$(go env GOPATH)/bin"
          } >> "$GITHUB_OUTPUT"

      - name: 缓存 Go 构建产物
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-bindings-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-bindings-${{ runner.os }}-

      - name: 安装 Linux 依赖
        run: |
          # runner 镜像预装的 packages.microsoft.com 源时不时返回 403，会让整条
          # apt-get update 以 exit 100 失败、把这一步带崩（见 run 32970102097）。
          # 本项目只要 Ubuntu 官方源里的 GTK / WebKit 开发包，直接把它摘掉。
          grep -rl 'packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      # main.go 用 //go:embed all:frontend/dist 嵌入前端产物，而 dist 不入库；
      # 校验流程不构建前端，补个占位文件让 embed 能解析（all: 前缀会收 . 开头的文件）
      - name: 准备 embed 占位目录
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/package.json'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # tsconfig 覆盖 bindings/ 目录，类型检查前需要先生成绑定
      - name: 缓存 Wails CLI
        uses: actions/cache@v6
        with:
          path: ${{ steps.gocache.outputs.bin }}/wails3
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: 生成 Wails 绑定
        run: |
          command -v wails3 >/dev/null 2>&1 || go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          wails3 generate bindings -ts -clean=true

      # tsconfig 覆盖 src/routeTree.gen.ts，该文件由 tanstack router 插件在构建时
      # 生成且不入库；顺带让 CI 真正跑一次生产构建，构建挂了也能立刻发现
      - name: 构建前端
        working-directory: frontend
        run: pnpm build

      - name: 类型检查
        working-directory: frontend
        run: pnpm typecheck

      - name: ESLint
        working-directory: frontend
        run: pnpm lint

      - name: 单元测试
        working-directory: frontend
        run: pnpm test
