name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

# 连续推 master 时旧的构建没有意义，只保留最新一次
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v3.0.0-beta.13

jobs:
  # 检查 commits，决定是否需要构建
  check-commits:
    name: 检查 commits
    runs-on: ubuntu-latest
    outputs:
      # 手动触发时 github.event.commits 是 null，没有 commit 可判断；
      # 既然是人主动点的，就当作明确想要一次构建
      should-build: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.check.outputs.should-build }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检查是否需要构建
        id: check
        if: github.event_name != 'workflow_dispatch'
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: python3 scripts/check_build.py

  # 打包前先跑完整校验（vet / test / typecheck / lint / 前端单测）
  # check.yaml 不再单独监听 push:master（否则每次推送校验会跑两遍），
  # 所以这里无论是否需要构建都要跑，纯文档提交也不能漏掉校验
  checks:
    name: 校验
    uses: ./.github/workflows/check.yaml

  build:
    needs: [check-commits, checks]
    # 只要有任意一个功能性 commit 且校验通过就触发构建
    if: needs.check-commits.outputs.should-build == 'true'
    # 构建任务
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            artifact: PostPigeon-macos-arm64
          - os: macos-15-intel
            arch: x64
            artifact: PostPigeon-macos-x64
          - os: windows-latest
            arch: x64
            artifact: PostPigeon-windows-x64
          - os: ubuntu-latest
            arch: x64
            artifact: PostPigeon-linux-x64

    name: 构建 ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # 使用 bash 作为默认 shell（Windows 会使用 Git Bash）
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # wails3 generate appimage 的 findGTKFiles 会 filepath.Walk 整个 /usr/ 去找
      # 三个 WebKit 文件，而 runner 的 /usr 里预装了 Android SDK、ghcup、dotnet 等
      # 二三十 GB、上百万个 inode，光遍历就要一两分钟。/opt 与 /usr 同在根文件系统，
      # mv 是 O(1) 重命名，比 rm -rf 删几个 GB 划算得多。
      - name: 挪走 runner 预装的大目录
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /opt/parked
          for d in /usr/local/lib/android /usr/local/.ghcup /usr/share/dotnet \
                   /usr/share/swift /usr/local/share/powershell \
                   /usr/lib/google-cloud-sdk /usr/share/miniconda; do
            if [ -e "$d" ]; then sudo mv "$d" /opt/parked/ && echo "已挪走 $d"; fi
          done

      # Windows 沿用 setup-go 自带缓存：那边打包才 30 秒，另存一份 Go 缓存
      # 的解压耗时比省下来的编译时间还长。
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          cache: ${{ runner.os == 'Windows' }}
          go-version-file: 'go.mod'

      - name: 解析 Go 缓存路径
        if: runner.os != 'Windows'
        id: gocache
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "bin=$(go env GOPATH)/bin"
          } >> "$GITHUB_OUTPUT"

      # setup-go 自带缓存的 key 只含 hash(go.sum)，check.yaml 的 `go build ./...`
      # 和这里的 `-tags production -trimpath` 生产构建会抢同一个条目（-trimpath
      # 让缓存条目完全不同），而且 setup-go 只在 miss 时写缓存、之后再不更新，
      # 于是 cgo 那 40 多秒每次都得重来。独立 key + restore-keys 让缓存滚动前进。
      # key 用 runner.arch 而不是矩阵变量：build.yaml 的矩阵字段是 arch(x64)、
      # release.yaml 的是 goarch(amd64)，各用各的会让同一台机器上的两条流水线
      # 互相看不见对方攒的缓存。Build 跑在 master 上，它的缓存对 tag 也可见，
      # 于是不常跑的 Release 能直接吃到热缓存。
      - name: 缓存 Go 构建产物
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: gopkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gopkg-${{ runner.os }}-${{ runner.arch }}-

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/package.json'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          # runner 镜像预装的 packages.microsoft.com 源时不时返回 403，会让整条
          # apt-get update 以 exit 100 失败、把这一步带崩（见 run 32970102097）。
          # 本项目只要 Ubuntu 官方源里的 GTK / WebKit 开发包，直接把它摘掉。
          grep -rl 'packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis --version=3.12 --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> "${GITHUB_PATH}"

      # setup-go 已把 GOPATH/bin 放进 PATH，缓存命中时 command -v 能直接找到，
      # 省掉一次编译（macOS Intel 上要 25 秒）
      - name: 缓存 Wails CLI
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ steps.gocache.outputs.bin }}/wails3
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: 安装 Wails CLI
        run: command -v wails3 >/dev/null 2>&1 || go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: 更新构建资源
        run: wails3 task common:update:build-assets

      - name: 构建应用
        run: wails3 package

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/

  # 生成构建摘要
  summary:
    needs: [check-commits, build]
    # 无论构建是否成功都生成摘要
    if: always() && needs.check-commits.outputs.should-build == 'true'
    name: 生成构建摘要
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 生成 Action Summary
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_summary.py
