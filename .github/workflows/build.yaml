name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  # 检查 commits，决定是否需要构建
  check-commits:
    name: 检查 commits
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 检查是否需要构建
        id: check
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: python3 scripts/check_build.py

  # 打包前先跑完整校验（vet / test / typecheck / lint / 前端单测）
  checks:
    name: 校验
    needs: check-commits
    if: needs.check-commits.outputs.should-build == 'true'
    uses: ./.github/workflows/ci.yaml

  build:
    needs: [check-commits, checks]
    # 只要有任意一个功能性 commit 且校验通过就触发构建
    if: needs.check-commits.outputs.should-build == 'true'
    # 构建任务
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            artifact: PostPigeon-macos-arm64
          - os: macos-15-intel
            arch: x64
            artifact: PostPigeon-macos-x64
          - os: windows-latest
            arch: x64
            artifact: PostPigeon-windows-x64
          - os: ubuntu-latest
            arch: x64
            artifact: PostPigeon-linux-x64

    name: 构建 ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # 使用 bash 作为默认 shell（Windows 会使用 Git Bash）
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: 'go.mod'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'frontend/package.json'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis --version=3.12 --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> "${GITHUB_PATH}"

      - name: 安装 Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.13

      - name: 更新构建资源
        run: wails3 task common:update:build-assets

      - name: 构建应用
        run: wails3 package

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/

  # 生成构建摘要
  summary:
    needs: [check-commits, build]
    # 无论构建是否成功都生成摘要
    if: always() && needs.check-commits.outputs.should-build == 'true'
    name: 生成构建摘要
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 生成 Action Summary
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_summary.py
