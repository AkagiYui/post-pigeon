name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（如 v1.2.0）'
        required: true

permissions:
  contents: write

env:
  APP_NAME: PostPigeon
  WAILS_VERSION: v3.0.0-beta.13
  # 随包分发的 WebView2 固定版本运行时；改版本号必须同步改摘要，
  # 否则 .github/actions/webview2-runtime 会当场报错（见那里的说明）。
  # 两条流水线要保持一致，改这里也要改 build.yaml。
  WEBVIEW2_RUNTIME_VERSION: "151.0.4129.107"
  WEBVIEW2_RUNTIME_SHA256: "09c191904ca71ca4a34a37074d1832e7589d7cc752f945511c968937814792a5"

jobs:
  # 第一道闸：tag 必须与仓库内容自洽，否则整个发版流程不启动。
  # 本地 pre-push 钩子跑的是同一个脚本，但钩子存在 .git/ 里、不随仓库分发，
  # --no-verify、网页界面打 tag、换台机器都能绕过，所以这里必须再拦一次。
  verify:
    name: 校验发版信息
    runs-on: ubuntu-latest
    steps:
      - name: 检出 tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 校验 tag 与 build/config.yml、CHANGELOG.md 是否一致
        run: python3 scripts/check_release.py "${{ github.event.inputs.tag || github.ref_name }}"

  # 发版前必须通过完整校验
  checks:
    name: 校验
    needs: verify
    uses: ./.github/workflows/check.yaml

  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [verify, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # secrets 上下文在 step 的 if: 里不可见，必须先映射到 env 才能用
    # env.XXX != '' 判断「有没有配签名」。全部为空时 macOS 产物退回 ad-hoc
    # 签名，其余平台完全不受影响，发版照常走完。
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    steps:
      # workflow_dispatch 时默认检出的是工作流所在分支而不是要发布的 tag，
      # 不显式指定 ref 的话会拿 master 的代码打上 tag 的版本号发出去
      - name: 检出 tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # build/config.yml 里的版本号由 wails3 task release:prepare 在发版提交里
      # 写好，并由 verify job 确认与 tag 一致，这里不再改写。Taskfile 的
      # APP_VERSION 读它，经 ldflags 注入 config.Version，应用运行时拿这个值
      # 与 Release 的 tag 比对来判断有没有新版本。

      # wails3 generate appimage 的 findGTKFiles 会 filepath.Walk 整个 /usr/ 去找
      # 三个 WebKit 文件，而 runner 的 /usr 里预装了 Android SDK、ghcup、dotnet 等
      # 二三十 GB、上百万个 inode，光遍历就要一两分钟。/opt 与 /usr 同在根文件系统，
      # mv 是 O(1) 重命名，比 rm -rf 删几个 GB 划算得多。
      - name: 挪走 runner 预装的大目录
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /opt/parked
          for d in /usr/local/lib/android /usr/local/.ghcup /usr/share/dotnet \
                   /usr/share/swift /usr/local/share/powershell \
                   /usr/lib/google-cloud-sdk /usr/share/miniconda; do
            if [ -e "$d" ]; then sudo mv "$d" /opt/parked/ && echo "已挪走 $d"; fi
          done

      # Windows 沿用 setup-go 自带缓存：那边打包才 30 秒，另存一份 Go 缓存
      # 的解压耗时比省下来的编译时间还长。
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          cache: ${{ runner.os == 'Windows' }}
          go-version-file: 'go.mod'

      - name: 解析 Go 缓存路径
        if: runner.os != 'Windows'
        id: gocache
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "bin=$(go env GOPATH)/bin"
            # 进 wails3 的缓存 key：见下方「缓存 Wails CLI」
            echo "goversion=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"

      # setup-go 自带缓存的 key 只含 hash(go.sum)，仓库里几个构建负载会抢同一个
      # 条目（-trimpath 的生产构建与普通 build 缓存条目完全不同），而且它只在
      # miss 时写入、之后永不更新，cgo 那 40 多秒于是每次重来。独立 key +
      # restore-keys 让缓存随 go.sum 滚动前进。
      # key 用 runner.arch 而不是矩阵变量：build.yaml 的矩阵字段是 arch(x64)、
      # release.yaml 的是 goarch(amd64)，各用各的会让同一台机器上的两条流水线
      # 互相看不见对方攒的缓存。Build 跑在 master 上，它的缓存对 tag 也可见，
      # 于是不常跑的 Release 能直接吃到热缓存。
      - name: 缓存 Go 构建产物
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: gopkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gopkg-${{ runner.os }}-${{ runner.arch }}-

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/package.json'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          # runner 镜像预装的 packages.microsoft.com 源时不时返回 403，会让整条
          # apt-get update 以 exit 100 失败、把这一步带崩（见 run 32970102097）。
          # 本项目只要 Ubuntu 官方源里的 GTK / WebKit 开发包，直接把它摘掉。
          grep -rl 'packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis --version=3.12 --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> "${GITHUB_PATH}"

      # setup-go 已把 GOPATH/bin 放进 PATH，缓存命中时 command -v 能直接找到，
      # 省掉一次编译（macOS Intel 上要 25 秒）
      # key 里必须带 Go 版本：wails3 generate bindings 用内嵌的 go/types 加载整个
      # 模块，二进制用哪个 Go 编译就只认到哪个语言版本。key 不含 Go 版本时，go.mod
      # 提版本后依然命中旧二进制，go1.26 编的 wails3 会把每个 package 都报成
      # "requires newer Go version"；wails3 又把这些降级成 warning 照常输出，于是
      # CI 全绿而绑定的类型信息已经退化（见 run 33141687183）。
      - name: 缓存 Wails CLI
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ steps.gocache.outputs.bin }}/wails3
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}-${{ steps.gocache.outputs.goversion }}

      - name: 安装 Wails CLI
        run: command -v wails3 >/dev/null 2>&1 || go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: 更新构建资源
        run: wails3 task common:update:build-assets

      # 证书导进临时钥匙串，构建结束即删。没配 secrets 时整步跳过，
      # codesign:mac 会自动退回 ad-hoc，不影响其它平台发版。
      - name: 导入 macOS 签名证书
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          # 钥匙串默认 5 分钟无操作自动上锁，而构建比这久得多，
          # 不改超时的话签名那一步会因为钥匙串已上锁而失败
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"

          printf '%s' "${MACOS_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm -f "${RUNNER_TEMP}/cert.p12"

          # 少了这句，codesign 取用私钥时会弹图形授权框，在无人值守的
          # runner 上表现为整步挂到超时
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null

          # 放进搜索列表，codesign 才找得到这个钥匙串里的身份；
          # 同时保留原有钥匙串，否则后续步骤取不到系统证书。
          # 逐行读进数组，而不是让命令替换自己分词：security 的输出是带引号且缩进的
          # 一行一个路径，靠分词的话路径里有空格就会被拆成两个参数
          EXISTING_KEYCHAINS=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"   # 去掉行首缩进
            line="${line%\"}"                          # 去掉两端引号
            line="${line#\"}"
            if [ -n "${line}" ]; then
              EXISTING_KEYCHAINS+=("${line}")
            fi
          done < <(security list-keychains -d user)
          # macOS runner 上是 bash 3.2，set -u 下展开空数组会报未绑定变量
          security list-keychains -d user -s "${KEYCHAIN}" \
            ${EXISTING_KEYCHAINS[@]+"${EXISTING_KEYCHAINS[@]}"}

          # 身份串（"Developer ID Application: 某某 (TEAMID)"）不是秘密，
          # 从证书里现取即可，不必再多配一个 secret
          IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN}" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"$/\1/')"
          if [ -z "${IDENTITY}" ]; then
            echo "::error::钥匙串里没有 Developer ID Application 证书，请检查 MACOS_CERTIFICATE"
            exit 1
          fi
          echo "签名身份：${IDENTITY}"
          echo "MACOS_SIGN_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"

      # 上一步把 MACOS_SIGN_IDENTITY 写进了 GITHUB_ENV，
      # build/darwin/Taskfile.yml 的 codesign:mac 读它决定正式签还是 ad-hoc
      - name: 打包应用
        run: wails3 package

      # 必须排在「归档发布产物」之前：staple 是往 .app 里写票据，
      # 归档一旦先做，发出去的就是没票据的包。
      - name: 公证并钉票据
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && env.APPLE_API_KEY_P8 != ''
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notarize_key.p8
        run: |
          set -euo pipefail
          printf '%s' "${APPLE_API_KEY_P8}" | base64 --decode > "${APPLE_API_KEY_PATH}"

          # 公证要把整个包传给苹果的公证服务，上传中途被掐是已知的偶发故障：
          # notarytool 走 S3 分片上传，submission ID 都拿到了才报 abortedUpload。
          # 不重试的话，每次发版都得有人盯着手动重跑。
          # 重复提交同一个包对苹果侧是安全的，代价只是多等一轮。
          max_attempts=3
          attempt=1
          until wails3 task darwin:notarize; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::公证连续 ${max_attempts} 次失败，本次发布中止"
              exit 1
            fi
            echo "::warning::公证第 ${attempt}/${max_attempts} 次失败，30 秒后重试"
            attempt=$((attempt + 1))
            sleep 30
          done

      - name: 检查签名状态
        if: runner.os == 'macOS'
        run: wails3 task darwin:sign:verify

      # 未签名的 macOS 产物照发不误，但要在 job 摘要里留个显眼的提示，
      # 免得当成正常发布推给用户
      - name: 提示 macOS 产物未签名
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE == ''
        run: echo "::warning::未配置 MACOS_CERTIFICATE，本次 macOS 产物为 ad-hoc 签名，用户下载后会被 Gatekeeper 拦下"

      - name: 提示 macOS 产物未公证
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && env.APPLE_API_KEY_P8 == ''
        run: echo "::warning::未配置 APPLE_API_KEY_P8，本次 macOS 产物已签名但未公证，Gatekeeper 仍会拦下"

      # 更新产物的命名与形态直接决定自动更新能不能跑通，两条硬约束：
      #   1. 文件名必须是 <AppName>-<GOOS>-<GOARCH>[.zip|.tar.gz|.exe]，
      #      应用侧的资产匹配器只认这个形状（见 internal/updates/manager.go）；
      #   2. 压缩包里必须恰好一个顶层条目——updater 替换的是磁盘上单个目标，
      #      归档里有多个顶层条目时它无法判断该把哪个换进去，会直接拒绝。
      # 安装包（NSIS / deb / AppImage）走各自的文件名，绝不会被当成更新产物：
      # 拿安装器替换正在运行的程序等于把应用变成一个安装向导。
      # ---- 内置 WebView2 内核的 Windows 产物 ----
      # 给装不上 / 留不住 Evergreen 运行时的机器：精简版 Ghost 系统、网吧还原卡与
      # 无盘、离线内网机。产物名带 -fixedwebview 后缀，因此不会被更新器选中
      # （internal/updates/manager.go 的 assetMatcher 只认无后缀的
      # <AppName>-<GOOS>-<GOARCH>[.zip|.tar.gz|.exe]）——这是刻意的：内核不参与
      # 应用更新，内置版用户照样走同一个 .exe 更新资产，更新包依旧是几十 MB。
      - name: 准备 WebView2 固定版本运行时
        if: runner.os == 'Windows'
        id: webview2
        uses: ./.github/actions/webview2-runtime
        with:
          version: ${{ env.WEBVIEW2_RUNTIME_VERSION }}
          sha256: ${{ env.WEBVIEW2_RUNTIME_SHA256 }}

      - name: 打包内置内核版
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WEBVIEW2_RUNTIME_DIR: ${{ steps.webview2.outputs.path }}
        run: >
          pwsh -File scripts/pack_bundled_webview.ps1
          -RuntimeDir $env:WEBVIEW2_RUNTIME_DIR
          -AppName "${{ env.APP_NAME }}"
          -Arch "${{ matrix.goarch }}"
          -OutDir dist

      - name: 归档发布产物
        id: package
        run: |
          set -euo pipefail
          NAME="${APP_NAME}"
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          mkdir -p dist

          case "$GOOS" in
            darwin)
              # ditto 保留 .app 里的符号链接、资源分叉与代码签名，
              # 普通 zip 会破坏签名导致 Gatekeeper 在替换后拦下应用
              ditto -c -k --keepParent "bin/${NAME}.app" "dist/${NAME}-darwin-${GOARCH}.zip"
              ;;
            windows)
              cp "bin/${NAME}.exe" "dist/${NAME}-windows-${GOARCH}.exe"
              # 按确切文件名取，不再用 *installer* 通配：bin/ 里现在同时躺着常规版和
              # 内置内核版两个安装包（见 build/windows/nsis/project.nsi 的
              # INSTALLER_VARIANT），通配匹配到哪个取决于文件系统的返回顺序。
              # NSIS 的 OutFile 用的是 GOARCH 之外的架构名，这里做一次映射。
              case "$GOARCH" in
                amd64) NSIS_ARCH="amd64" ;;
                arm64) NSIS_ARCH="arm64" ;;
                *)     NSIS_ARCH="$GOARCH" ;;
              esac
              installer="bin/${NAME}-${NSIS_ARCH}-installer.exe"
              if [ -f "${installer}" ]; then
                cp "${installer}" "dist/${NAME}-windows-${GOARCH}-installer.exe"
              else
                echo "::warning::未找到 NSIS 安装包：${installer}"
              fi
              ;;
            linux)
              tar -czf "dist/${NAME}-linux-${GOARCH}.tar.gz" -C bin "${NAME}"
              # AppImage / deb / rpm 只作为首次安装的渠道一并发布，
              # 它们的文件名不符合更新产物的命名规范，不会被更新器选中
              for pkg in bin/*.AppImage bin/*.deb bin/*.rpm bin/*.pkg.tar.zst; do
                [ -e "${pkg}" ] && cp "${pkg}" dist/ || true
              done
              ;;
          esac

          ls -l dist

      # 名字带 release- 前缀，好让下面的 release job 只捞发布产物：
      # checks 复用的 check.yaml 也会上传一个 go-coverage 工件，不加区分地
      # merge-multiple 会把覆盖率报告一起发到 Release 里去
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

      # runner 本就是一次性的，但凭据不该在后续步骤里继续可用
      - name: 清理签名凭据
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "${RUNNER_TEMP}/codesign.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/notarize_key.p8" "${RUNNER_TEMP}/cert.p12"

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出 tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 解析版本号
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 下载全部发布产物
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      # 更新器下载完产物后会按 SHA256SUMS 校验摘要（github provider 的
      # ChecksumAsset）。文件名必须与 Release 资产名一一对应，所以在这里、
      # 所有平台的产物都到齐之后统一算一次。
      - name: 生成校验和
        run: |
          set -euo pipefail
          cd artifacts
          # 用 -- 而不是 ./*：SHA256SUMS 里的文件名必须与 Release 资产名逐字相同，
          # 更新器要靠它对上号，写成 ./PostPigeon-... 就匹配不上了
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS

      # 发布说明以 CHANGELOG.md 为准（人工润色、面向使用者）。正式版的范围固定为
      # 「上一个正式版..本版」，中间的 beta / rc 小节也会收进正文；预发布版才以
      # 上一个语义化版本为基线。由提交生成的详细清单折叠在后面备查，并复用同一
      # 套区间算法，避免两个区块各说各话。
      # CHANGELOG.md 本身也作为资产上传：应用要靠它做跨版本的变更日志聚合，
      # 一次请求拿到完整历史，不必受 GitHub API 未认证限流的约束。
      - name: 生成发布说明
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          python3 scripts/extract_changelog.py "$TAG" --release-notes > RELEASE_NOTES.md
          {
            echo
            echo "<!-- postpigeon:commit-details -->"
            echo "<details><summary>完整提交记录</summary>"
            echo
            python3 scripts/generate_changelog.py "$TAG"
            echo
            echo "</details>"
          } >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*
            SHA256SUMS
            CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
