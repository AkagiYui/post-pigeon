name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（如 v1.2.0）'
        required: true

permissions:
  contents: write

env:
  APP_NAME: PostPigeon

jobs:
  # 第一道闸：tag 必须与仓库内容自洽，否则整个发版流程不启动。
  # 本地 pre-push 钩子跑的是同一个脚本，但钩子存在 .git/ 里、不随仓库分发，
  # --no-verify、网页界面打 tag、换台机器都能绕过，所以这里必须再拦一次。
  verify:
    name: 校验发版信息
    runs-on: ubuntu-latest
    steps:
      - name: 检出 tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 校验 tag 与 build/config.yml、CHANGELOG.md 是否一致
        run: python3 scripts/check_release.py "${{ github.event.inputs.tag || github.ref_name }}"

  # 发版前必须通过完整校验
  checks:
    name: 校验
    needs: verify
    uses: ./.github/workflows/ci.yaml

  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [verify, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      # workflow_dispatch 时默认检出的是工作流所在分支而不是要发布的 tag，
      # 不显式指定 ref 的话会拿 master 的代码打上 tag 的版本号发出去
      - name: 检出 tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # build/config.yml 里的版本号由 wails3 task release:prepare 在发版提交里
      # 写好，并由 verify job 确认与 tag 一致，这里不再改写。Taskfile 的
      # APP_VERSION 读它，经 ldflags 注入 config.Version，应用运行时拿这个值
      # 与 Release 的 tag 比对来判断有没有新版本。

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: 'go.mod'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'frontend/package.json'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis --version=3.12 --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> "${GITHUB_PATH}"

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.13

      - name: 更新构建资源
        run: wails3 task common:update:build-assets

      - name: 打包应用
        run: wails3 package

      # 更新产物的命名与形态直接决定自动更新能不能跑通，两条硬约束：
      #   1. 文件名必须是 <AppName>-<GOOS>-<GOARCH>[.zip|.tar.gz|.exe]，
      #      应用侧的资产匹配器只认这个形状（见 internal/updates/manager.go）；
      #   2. 压缩包里必须恰好一个顶层条目——updater 替换的是磁盘上单个目标，
      #      归档里有多个顶层条目时它无法判断该把哪个换进去，会直接拒绝。
      # 安装包（NSIS / deb / AppImage）走各自的文件名，绝不会被当成更新产物：
      # 拿安装器替换正在运行的程序等于把应用变成一个安装向导。
      - name: 归档发布产物
        id: package
        run: |
          set -euo pipefail
          NAME="${APP_NAME}"
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          mkdir -p dist

          case "$GOOS" in
            darwin)
              # ditto 保留 .app 里的符号链接、资源分叉与代码签名，
              # 普通 zip 会破坏签名导致 Gatekeeper 在替换后拦下应用
              ditto -c -k --keepParent "bin/${NAME}.app" "dist/${NAME}-darwin-${GOARCH}.zip"
              ;;
            windows)
              cp "bin/${NAME}.exe" "dist/${NAME}-windows-${GOARCH}.exe"
              installer=$(ls bin/*installer*.exe 2>/dev/null | head -1 || true)
              if [ -n "${installer}" ]; then
                cp "${installer}" "dist/${NAME}-windows-${GOARCH}-installer.exe"
              else
                echo "::warning::未找到 NSIS 安装包"
              fi
              ;;
            linux)
              tar -czf "dist/${NAME}-linux-${GOARCH}.tar.gz" -C bin "${NAME}"
              # AppImage / deb / rpm 只作为首次安装的渠道一并发布，
              # 它们的文件名不符合更新产物的命名规范，不会被更新器选中
              for pkg in bin/*.AppImage bin/*.deb bin/*.rpm bin/*.pkg.tar.zst; do
                [ -e "${pkg}" ] && cp "${pkg}" dist/ || true
              done
              ;;
          esac

          ls -l dist

      # 名字带 release- 前缀，好让下面的 release job 只捞发布产物：
      # checks 复用的 ci.yaml 也会上传一个 go-coverage 工件，不加区分地
      # merge-multiple 会把覆盖率报告一起发到 Release 里去
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出 tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 解析版本号
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 下载全部发布产物
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      # 更新器下载完产物后会按 SHA256SUMS 校验摘要（github provider 的
      # ChecksumAsset）。文件名必须与 Release 资产名一一对应，所以在这里、
      # 所有平台的产物都到齐之后统一算一次。
      - name: 生成校验和
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > ../SHA256SUMS
          cat ../SHA256SUMS

      # 发布说明以 CHANGELOG.md 为准（人工润色、面向使用者），
      # 由提交生成的详细清单折叠在后面备查。
      # CHANGELOG.md 本身也作为资产上传：应用要靠它做跨版本的变更日志聚合，
      # 一次请求拿到完整历史，不必受 GitHub API 未认证限流的约束。
      - name: 生成发布说明
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          python3 scripts/extract_changelog.py "$TAG" > RELEASE_NOTES.md
          {
            echo
            echo "<details><summary>完整提交记录</summary>"
            echo
            python3 scripts/generate_changelog.py "$TAG"
            echo
            echo "</details>"
          } >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*
            SHA256SUMS
            CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
