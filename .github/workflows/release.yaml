name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（如 v1.2.0）'
        required: true

permissions:
  contents: write

jobs:
  # 发版前必须通过完整校验
  checks:
    name: 校验
    uses: ./.github/workflows/ci.yaml

  build:
    name: 构建 ${{ matrix.os }} (${{ matrix.arch }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            artifact: PostPigeon-macos-arm64
          - os: macos-15-intel
            arch: x64
            artifact: PostPigeon-macos-x64
          - os: windows-latest
            arch: x64
            artifact: PostPigeon-windows-x64
          - os: ubuntu-latest
            arch: x64
            artifact: PostPigeon-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 解析版本号
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # 版本号唯一真实来源是 git tag：构建前把它写入 build/config.yml，
      # 由 Taskfile 的 APP_VERSION 读取并通过 ldflags 注入到 config.Version。
      - name: 同步版本号到 build/config.yml
        run: python3 scripts/set_version.py "${{ steps.version.outputs.version }}"

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: 'go.mod'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'frontend/package.json'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis --version=3.12 --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> "${GITHUB_PATH}"

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 更新构建资源
        run: wails3 task common:update:build-assets

      - name: 打包应用
        run: wails3 package

      - name: 归档产物
        run: |
          cd bin
          tar -czf "../${{ matrix.artifact }}.tar.gz" .

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 下载全部产物
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成变更日志
        id: changelog
        run: python3 scripts/generate_changelog.py > RELEASE_NOTES.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
