version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # 签名配置全部走环境变量，不写进仓库（见 CONTRIBUTING.md「macOS 代码签名」）：
  #   MACOS_SIGN_IDENTITY   Developer ID Application 身份名，设了才做正式签名
  #   APPLE_API_KEY_PATH / APPLE_API_KEY_ID / APPLE_API_ISSUER   公证用 API Key
  #   APPLE_KEYCHAIN_PROFILE                                     公证用本机配置档
  # 一个都不设时打包依然成功，只是退回 ad-hoc 签名，方便没有开发者账号的人构建。

  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq OS "darwin"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT}}
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -X PostPigeon/internal/config.BuildHash={{.BUILD_HASH}} -X PostPigeon/internal/config.Version={{.APP_VERSION | default "0.0.1"}} -X PostPigeon/internal/config.BuildTime={{.BUILD_TIME}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=10.15"
      CGO_LDFLAGS: "-mmacosx-version-min=10.15"
      MACOSX_DEPLOYMENT_TARGET: "10.15"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: common:build:frontend
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.GO_CACHE_MOUNT}} {{.REPLACE_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Mount Go module cache for faster builds
      GO_CACHE_MOUNT:
        sh: 'echo "-v ${GOPATH:-$HOME/go}/pkg/mod:/go/pkg/mod"'
      # Extract replace directives from go.mod and create -v mounts for each
      # Handles both relative (=> ../) and absolute (=> /) paths
      REPLACE_MOUNTS:
        sh: |
          grep -E '^replace .* => ' go.mod 2>/dev/null | while read -r line; do
            path=$(echo "$line" | sed -E 's/^replace .* => //' | tr -d '\r')
            # Convert relative paths to absolute
            if [ "${path#/}" = "$path" ]; then
              path="$(cd "$(dirname "$path")" 2>/dev/null && pwd)/$(basename "$path")"
            fi
            # Only mount if directory exists
            if [ -d "$path" ]; then
              echo "-v $path:$path:ro"
            fi
          done | tr '\n' ' '

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle


  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - task: inject:localizations
        vars:
          PLIST: '{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist'
      - task: '{{if eq OS "darwin"}}codesign:mac{{else}}codesign:skip{{end}}'

  inject:localizations:
    summary: 从 frontend/src/i18n/*.json 的文件名派生 CFBundleLocalizations 写入 Info.plist
    internal: true
    cmds:
      - |
        PLIST="{{.PLIST}}"
        PB=/usr/libexec/PlistBuddy
        $PB -c "Delete :CFBundleLocalizations" "$PLIST" 2>/dev/null || true
        $PB -c "Add :CFBundleLocalizations array" "$PLIST"
        for f in frontend/src/i18n/*.json; do
          loc=$(basename "$f" .json)
          $PB -c "Add :CFBundleLocalizations: string $loc" "$PLIST"
        done
        $PB -c "Delete :CFBundleDevelopmentRegion" "$PLIST" 2>/dev/null || true
        $PB -c "Add :CFBundleDevelopmentRegion string en" "$PLIST"

  codesign:mac:
    summary: 签名 .app —— 有 Developer ID 就正式签，否则退回 ad-hoc
    internal: true
    cmds:
      - |
        set -eu
        APP="{{.BIN_DIR}}/{{.APP_NAME}}.app"
        if [ -z "${MACOS_SIGN_IDENTITY:-}" ]; then
          # ad-hoc 包能在本机跑，但分发出去 spctl 直接 rejected，
          # 只适合本地构建和没有开发者账号的贡献者。
          echo "未设置 MACOS_SIGN_IDENTITY，使用 ad-hoc 签名（不可对外分发）"
          codesign --force --sign - "$APP"
          exit 0
        fi
        # 不用 --deep：Apple 已不推荐，且本包内没有嵌套 framework/helper，
        # 直接签 bundle 就够（Contents 下只有 MacOS/ 与 Resources/）。
        # --options runtime 启用加固运行时，是公证的硬性前提；
        # --timestamp 打可信时间戳，让签名在证书过期后依然有效。
        echo "使用 Developer ID 签名：$MACOS_SIGN_IDENTITY"
        if [ -f build/darwin/entitlements.plist ]; then
          codesign --force --timestamp --options runtime \
            --entitlements build/darwin/entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
        else
          codesign --force --timestamp --options runtime \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
        fi
        codesign --verify --strict --verbose=2 "$APP"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  run:
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - task: inject:localizations
        vars:
          PLIST: '{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist'
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}'

  notarize:
    summary: 公证 .app 并把票据钉进包里（需先 wails3 package）
    desc: |
      把已签名的 .app 提交 Apple 公证，通过后 staple 票据。
      前提：包必须是 Developer ID + 加固运行时签的，ad-hoc 包提交必被拒。

      凭据二选一：
        1) App Store Connect API Key（推荐，CI 用）
           APPLE_API_KEY_PATH  下载的 AuthKey_XXXXXX.p8 路径
           APPLE_API_KEY_ID    Key ID
           APPLE_API_ISSUER    Issuer ID
        2) 本机钥匙串配置档（本地手动发版用）
           APPLE_KEYCHAIN_PROFILE  配置档名字
           一次性创建：
             xcrun notarytool store-credentials "配置档名字" \
               --apple-id you@example.com --team-id TEAMID \
               --password 应用专用密码
    cmds:
      - |
        set -eu
        APP="{{.BIN_DIR}}/{{.APP_NAME}}.app"
        if [ ! -d "$APP" ]; then
          echo "找不到 $APP，先跑 wails3 package"
          exit 1
        fi
        # 加固运行时没开的话公证一定失败，与其等 Apple 回绝不如就地拦下
        if ! codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'flags=.*runtime'; then
          echo "错误：$APP 未启用加固运行时，无法公证。"
          echo "请设置 MACOS_SIGN_IDENTITY 后重新 wails3 package。"
          exit 1
        fi

        # 公证提交的是压缩包，但票据是 staple 回 .app 本身的，
        # 所以这个 zip 只是运输载体；发布产物必须在 staple 之后重新打包。
        TMP="{{.BIN_DIR}}/.notarize"
        rm -rf "$TMP"
        mkdir -p "$TMP"
        ditto -c -k --keepParent "$APP" "$TMP/notarize.zip"

        if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
          xcrun notarytool submit "$TMP/notarize.zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
        elif [ -n "${APPLE_KEYCHAIN_PROFILE:-}" ]; then
          xcrun notarytool submit "$TMP/notarize.zip" \
            --keychain-profile "$APPLE_KEYCHAIN_PROFILE" \
            --wait
        else
          echo "未提供公证凭据：需要 APPLE_API_KEY_PATH 三件套，或 APPLE_KEYCHAIN_PROFILE。"
          echo "详见 wails3 task darwin:notarize --summary"
          rm -rf "$TMP"
          exit 1
        fi

        rm -rf "$TMP"
        xcrun stapler staple "$APP"
        xcrun stapler validate "$APP"

  sign:verify:
    summary: 检查 .app 的签名与公证状态（发版前自查）
    cmds:
      - |
        set -eu
        APP="{{.BIN_DIR | default "bin"}}/{{.APP_NAME}}.app"
        echo "=== codesign -dv ==="
        codesign -dv --verbose=4 "$APP" 2>&1 || true
        echo
        echo "=== codesign --verify ==="
        codesign --verify --strict --verbose=2 "$APP" 2>&1 || true
        echo
        echo "=== stapler ==="
        xcrun stapler validate "$APP" 2>&1 || true
        echo
        # 这行才是最终判据：只有 accepted + source=Notarized Developer ID
        # 才是用户下载后能直接双击打开的状态。
        echo "=== spctl（判据在这行）==="
        spctl -a -vvv -t exec "$APP" 2>&1 || true
